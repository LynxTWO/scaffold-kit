name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  suite:
    # Preserve the existing required-check names on Linux.
    name: Python ${{ matrix.python-version }}${{ matrix.platform-label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - os: macos-latest
            python-version: "3.9"
            platform-label: " (macOS)"
          - os: macos-latest
            python-version: "3.15"
            platform-label: " (macOS)"
          - os: windows-latest
            python-version: "3.9"
            platform-label: " (Windows)"
          - os: windows-latest
            python-version: "3.15"
            platform-label: " (Windows)"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run audit and listing regressions
        run: python -B -m unittest discover -s skills/scaffold-kit/tests
      - name: Check brief artifact integrity
        run: python -B -m unittest discover -s tests
